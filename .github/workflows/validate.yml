name: Validate reference fleet

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_legacy_brand.py
      - run: python scripts/check_links.py
      - run: python scripts/check_repository_settings.py
      - run: python scripts/cross_agent_smoke.py
      - run: python -m json.tool openclaw.json >/dev/null
      - run: python -m py_compile simulate.py scripts/*.py tests/test_repo.py
      - name: Check out pinned Caura OSS contract source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: caura-ai/caura
          ref: b3ef955a6ac70c43652e1567770668af042721f1
          path: _contract/caura
          persist-credentials: false
      - run: python scripts/check_oss_contract.py --oss-root _contract/caura
