<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Caura long-run research fleet</title>
  <desc id="desc">Three AI agents sharing a governed Caura memory pool over a fourteen-day simulation.</desc>
  <defs>
    <radialGradient id="left" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#c44a00"/>
      <stop offset=".55" stop-color="#5b120d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#050008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#ff8a34"/>
      <stop offset="1" stop-color="#9d6cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#050008"/>
  <rect width="1200" height="675" fill="url(#left)"/>
  <text x="72" y="90" fill="#ff9a51" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="6">CAURA</text>
  <text x="72" y="250" fill="#fff" font-family="Georgia, serif" font-size="74" font-weight="700">Long-run research fleet</text>
  <text x="75" y="310" fill="#ddd6e8" font-family="Arial, sans-serif" font-size="27">Three agents. One governed memory pool. Fourteen simulated days.</text>
  <path d="M190 445 H1010" stroke="url(#line)" stroke-width="4"/>
  <g fill="#0e0b14" stroke="#ff8a34" stroke-width="3">
    <rect x="90" y="405" width="205" height="82" rx="18"/>
    <rect x="497" y="405" width="205" height="82" rx="18"/>
    <rect x="905" y="405" width="205" height="82" rx="18"/>
    <rect x="420" y="545" width="360" height="82" rx="18" stroke="#9d6cff"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="193" y="455">Sourcing agent</text>
    <text x="600" y="455">Verification agent</text>
    <text x="1008" y="455">Synthesis agent</text>
    <text x="600" y="595">Caura fleet memory</text>
  </g>
  <path d="M193 488 L505 545 M600 488 V545 M1008 488 L695 545" stroke="#ded7eb" stroke-width="3" fill="none"/>
</svg>
